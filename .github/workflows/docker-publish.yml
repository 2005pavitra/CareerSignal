name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'pavitrapandey' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend image
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'pavitrapandey' }}/careersignal-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'pavitrapandey' }}/careersignal-backend:${{ github.sha }}

      - name: Build and push Frontend image
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=http://localhost:4000
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'pavitrapandey' }}/careersignal-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'pavitrapandey' }}/careersignal-frontend:${{ github.sha }}
